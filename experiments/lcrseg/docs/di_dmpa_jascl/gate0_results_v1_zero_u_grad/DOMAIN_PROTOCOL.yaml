schema_version: 1
protocol_name: LCRSeg_fixed_class_domain_incremental_v1
benchmarks_are_independent: true
method_registered: false
final_test_gt_policy: evaluator_only
ignore_label: 255
role_contract:
  train_labeled:
    training_allowed: true
    label_visible: true
  train_unlabeled:
    training_allowed: true
    label_visible: false
    required_empty_manifest_fields: [label_h5_relpath, label_sha256]
  val:
    training_allowed: false
    evaluator_allowed: true
    checkpoint_selection_allowed: true
  test:
    training_allowed: false
    evaluator_allowed: true
    checkpoint_selection_allowed: false
    threshold_selection_allowed: false
